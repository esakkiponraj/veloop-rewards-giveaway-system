<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="airpodsGlow" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#065f46" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0a0b10" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="caseGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="earbudStem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="80%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="metalChrome" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>

  <!-- Background Environment -->
  <rect width="500" height="500" fill="#0c0d14"/>
  <ellipse cx="250" cy="380" rx="190" ry="50" fill="url(#airpodsGlow)"/>

  <!-- Left Earbud -->
  <g transform="translate(145, 110) rotate(-15)">
    <!-- Stem -->
    <rect x="35" y="70" width="16" height="75" rx="8" fill="url(#earbudStem)" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Chrome Bottom Ring -->
    <rect x="35" y="137" width="16" height="8" rx="4" fill="url(#metalChrome)"/>
    <!-- Head Body -->
    <ellipse cx="40" cy="55" rx="28" ry="24" fill="url(#earbudStem)" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Silicone Tip -->
    <ellipse cx="16" cy="55" rx="16" ry="18" fill="#e2e8f0"/>
    <!-- Acoustic Mesh Vent (Black) -->
    <ellipse cx="46" cy="46" rx="8" ry="5" fill="#1e293b"/>
    <ellipse cx="38" cy="85" rx="3" ry="8" fill="#334155"/>
  </g>

  <!-- Right Earbud -->
  <g transform="translate(275, 105) rotate(15)">
    <!-- Stem -->
    <rect x="35" y="70" width="16" height="75" rx="8" fill="url(#earbudStem)" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Chrome Bottom Ring -->
    <rect x="35" y="137" width="16" height="8" rx="4" fill="url(#metalChrome)"/>
    <!-- Head Body -->
    <ellipse cx="46" cy="55" rx="28" ry="24" fill="url(#earbudStem)" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Silicone Tip -->
    <ellipse cx="70" cy="55" rx="16" ry="18" fill="#e2e8f0"/>
    <!-- Acoustic Mesh Vent (Black) -->
    <ellipse cx="40" cy="46" rx="8" ry="5" fill="#1e293b"/>
    <ellipse cx="44" cy="85" rx="3" ry="8" fill="#334155"/>
  </g>

  <!-- MagSafe Charging Case (Bottom Half) -->
  <g transform="translate(140, 240)">
    <rect x="0" y="20" width="220" height="140" rx="44" fill="url(#caseGloss)" stroke="#94a3b8" stroke-width="1.5" filter="drop-shadow(0 20px 25px rgba(0,0,0,0.6))"/>
    <!-- Status LED Indicator (Green Glow) -->
    <circle cx="110" cy="70" r="4" fill="#22c55e" filter="drop-shadow(0 0 6px #22c55e)"/>
    <!-- Lanyard Loop (Side) -->
    <rect x="216" y="60" width="6" height="24" rx="3" fill="url(#metalChrome)"/>
  </g>

  <!-- Case Highlight -->
  <path d="M 170 265 Q 250 280, 330 265" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
</svg>
