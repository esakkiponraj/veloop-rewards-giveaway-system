<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="indigoGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#312e81" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0a0b10" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="voucherGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="500" height="500" fill="#0c0d14"/>
  <circle cx="250" cy="250" r="190" fill="url(#indigoGlow)"/>

  <!-- Ticket / Coupon Style Shape -->
  <g transform="translate(60, 130)">
    <path d="M 20 0 L 360 0 C 370 0 380 10 380 20 L 380 90 C 365 90 355 105 355 115 C 355 125 365 140 380 140 L 380 210 C 380 220 370 230 360 230 L 20 230 C 10 230 0 220 0 210 L 0 140 C 15 140 25 125 25 115 C 25 105 15 90 0 90 L 0 20 C 0 10 10 0 20 0 Z" fill="url(#voucherGrad)" stroke="#818cf8" stroke-width="2" filter="drop-shadow(0 15px 25px rgba(0,0,0,0.8))"/>

    <!-- Perforated Line -->
    <line x1="260" y1="15" x2="260" y2="215" stroke="#4338ca" stroke-width="2" stroke-dasharray="6,6"/>

    <!-- Left Content -->
    <text x="35" y="65" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#ffffff">amazon<tspan font-size="14" fill="#818cf8">.in</tspan></text>
    <text x="35" y="90" font-family="sans-serif" font-size="11" font-weight="600" fill="#94a3b8">SHOPPING VOUCHER</text>

    <text x="35" y="150" font-family="sans-serif" font-size="36" font-weight="800" fill="#a5b4fc">₹20</text>
    <text x="35" y="175" font-family="sans-serif" font-size="10" font-weight="600" fill="#c7d2fe">TOKEN REDEMPTION SPECIAL</text>

    <!-- Right Content (Stub) -->
    <text x="320" y="90" font-family="sans-serif" font-size="11" font-weight="700" fill="#e0e7ff" text-anchor="middle">ENTRY</text>
    <text x="320" y="125" font-family="sans-serif" font-size="22" font-weight="800" fill="#fbbf24" text-anchor="middle">2K</text>
    <text x="320" y="145" font-family="sans-serif" font-size="10" font-weight="700" fill="#94a3b8" text-anchor="middle">TOKENS</text>
